services:
  backend:
    build: ./back-java
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  frontend:
    build: ./front
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_healthy
